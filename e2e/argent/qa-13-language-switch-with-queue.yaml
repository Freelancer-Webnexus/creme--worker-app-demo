version: 1
steps:
  - launch: com.joaopaulomarra.workerapp
  - run: lib/baseline.yaml
  - launch: com.joaopaulomarra.workerapp
  - run: lib/sign-in-ana.yaml
  - echo: Queue a terms confirmation offline. Switch the language while it is queued
  - run: lib/offline-on.yaml
  - tap: { text: Términos }
  - await: { visible: { id: terms-screen } }
  - await: { idle: true }
  - tap: { id: terms-confirm }
  - await: { visible: { text: Guardado en este teléfono } }
  - await: { idle: true }
  - tap: { text: Inicio }
  - await: { visible: { id: home-greeting } }
  - await: { idle: true }
  - assert: { visible: { text: 'Confirmados en este teléfono, falta enviarlos' } }
  - scroll-to: { target: { id: home-sign-out } }
  - run: lib/dismiss-logbox.yaml
  - tap: { text: English }
  - scroll-to: { target: { id: home-greeting }, direction: up }
  - await: { text: { in: { id: home-greeting }, equals: 'Hi, Ana' } }
  - await: { idle: true }
  - echo: The pending state is still shown, now in English. The queue was not lost
  - assert: { visible: { text: 'Confirmed on this phone, not sent yet' } }
  - assert: { hidden: { text: 'Confirmados en este teléfono, falta enviarlos' } }
  - when: { platform: android }
    steps:
      - assert: { visible: { text: '1 action saved on this phone, waiting for connection.' } }
  - echo: Go back online. The action is delivered once and the screen stays in English
  - run: lib/offline-off.yaml
  - await: { text: { in: { id: home-step-terms_confirmed }, contains: Done }, timeout: 90000 }
  - assert: { visible: { text: Terms confirmed } }
  - script: { path: scripts/assert-terms-1.mjs }
