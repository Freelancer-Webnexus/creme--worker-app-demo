version: 1
steps:
  - launch: com.joaopaulomarra.workerapp
  - run: lib/baseline.yaml
  - launch: com.joaopaulomarra.workerapp
  - await: { visible: { id: phone-screen } }
  - wait: 600
  - echo: Fresh install. The phone screen is in Spanish
  - assert: { visible: { text: Entra con tu celular } }
  - run: lib/sign-in-ana.yaml
  - echo: Signed in as Ana. Home is in Spanish, including the tab bar
  - assert: { text: { in: { id: home-greeting }, equals: 'Hola, Ana' } }
  - assert: { visible: { text: Nada por enviar en este teléfono } }
  - assert: { visible: { text: Inicio } }
  - assert: { visible: { text: Documentos } }
  - assert: { visible: { text: Términos } }
  - assert: { visible: { text: Falta confirmar los términos } }
  - echo: Switch to English on Home. Every string changes
  - scroll-to: { target: { id: home-sign-out } }
  - run: lib/dismiss-logbox.yaml
  - tap: { text: English }
  - scroll-to: { target: { id: home-greeting }, direction: up }
  - await: { text: { in: { id: home-greeting }, equals: 'Hi, Ana' } }
  - await: { idle: true }
  - assert: { visible: { text: Nothing waiting to be sent from this phone } }
  - assert: { visible: { text: Home } }
  - assert: { visible: { text: Documents } }
  - assert: { visible: { text: Terms } }
  - assert: { visible: { text: The terms still need your confirmation } }
  - assert: { hidden: { text: Nada por enviar en este teléfono } }
  - assert: { hidden: { text: Inicio } }
  - assert: { hidden: { text: Términos } }
  - echo: The Documents and Terms screens are in English too
  - tap: { text: Documents }
  - await: { visible: { id: documents-screen } }
  - await: { idle: true }
  - assert: { visible: { text: Not sent } }
  - assert: { hidden: { text: Sin enviar } }
  - tap: { text: Terms }
  - await: { visible: { id: terms-screen } }
  - await: { idle: true }
  - assert: { visible: { text: Read the terms and confirm that you accept them } }
